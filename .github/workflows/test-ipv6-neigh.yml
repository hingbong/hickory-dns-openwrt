name: Test ipv6-neigh

on:
  push:
    paths:
      - "ipv6-neigh/**"
      - ".github/workflows/test-ipv6-neigh.yml"
  pull_request:
    paths:
      - "ipv6-neigh/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run unit tests
        working-directory: ipv6-neigh
        run: cargo test --locked

      - name: Run clippy
        working-directory: ipv6-neigh
        run: cargo clippy --locked --all-targets -- -D warnings
